name: Railway Availability Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Indian Railways website
        run: |
          echo "Testing Indian Railways availability page..."

          curl -L -sS \
            "https://indianrail.gov.in/enquiry/SEAT/SeatAvailability.html?locale=en" \
            -o railway.html

          echo "Railway page downloaded."

          grep -i "Accommodation Availability" railway.html | head -5

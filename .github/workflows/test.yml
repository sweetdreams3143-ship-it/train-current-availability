name: Railway JS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download Railway JavaScript
        run: |
          curl -L -sS \
            "https://indianrail.gov.in/enquiry/js/SeatAvailability.js?version=9" \
            -o SeatAvailability.js

          echo "=== SEAT AVAILABILITY JS ==="
          cat SeatAvailability.js

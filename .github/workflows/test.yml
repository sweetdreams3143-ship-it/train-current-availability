name: Railway Form Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download Railway page
        run: |
          curl -L -sS \
            "https://indianrail.gov.in/enquiry/SEAT/SeatAvailability.html?locale=en" \
            -o railway.html

          echo "=== FORM DETAILS ==="
          grep -iE '<form|<input|<select|<option' railway.html | head -100

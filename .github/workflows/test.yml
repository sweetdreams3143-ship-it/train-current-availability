name: Railway AJAX Request

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get AJAX request
        run: |
          curl -L -sS \
            "https://indianrail.gov.in/enquiry/js/SeatAvailability.js?version=9" \
            -o SeatAvailability.js

          echo "=== AJAX REQUEST ==="

          sed -n '585,625p' SeatAvailability.js

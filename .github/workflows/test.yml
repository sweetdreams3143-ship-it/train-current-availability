name: Telegram Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RS_TELEGRAM_CHAT_ID: ${{ secrets.RS_TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${RS_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚆 Train Availability Monitor%0A%0A✅ Test notification successful!%0A%0AOur free automation setup is working."
